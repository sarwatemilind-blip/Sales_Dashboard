async function loadStockStatementData(){
  isStockStatementDirty = false;
  const body = document.getElementById("stockBody");
  if (!body) return;

  const scopeIds = getActiveScopeIdsForSelection();
  const scopeKey = selectedEmpId || 'overall';
  const targetYear = currentYear;
  const targetMonth = currentMonth;
  // Refresh DB edit-window flags so employees always see admin's latest setting for this month
  await loadEditConfig(targetYear, targetMonth);
  const scopeName = selectedEmpId === 'overall'
    ? `Overall Scope (${scopeLabel(session)})`
    : (allDownlineEmployees.find(e => e.emp_id === selectedEmpId) ? scopeLabel(allDownlineEmployees.find(e => e.emp_id === selectedEmpId)) : scopeLabel(session));
  const scopePill = document.getElementById("stockScopePill");
  if (scopePill) {
    scopePill.textContent = `${scopeIds.length} employee${scopeIds.length > 1 ? 's' : ''} in scope`;
  }

  body.innerHTML = `<p class="muted">Loading...</p>`;

  const allMappings = (await sb.from('stockist_mapping').select('*')).data || [];
  await loadHiddenStockists();
  const visibleMappings = session.is_admin
    ? allMappings
    : allMappings.filter(row => !hiddenStockistCodes.has(normalizeEmpId(row.stockist_code).toUpperCase()));
  const visibleStockists = visibleMappings.filter(row => {
    const assignees = [
      row.be_emp_id_1, row.be_emp_id_2, row.be_emp_id_3,
      row.asm_emp_id, row.rsm_emp_id, row.zm_emp_id, row.vp_emp_id
    ].map(normalizeEmpId).filter(Boolean);
    return assignees.some(id => scopeIds.includes(id));
  });
  const visibleStockistMap = new Map();
  visibleStockists.forEach(row => {
    visibleStockistMap.set(normalizeEmpId(row.stockist_code), row);
  });
  const stockistSelector = document.getElementById("stockStockistSel");
  const visibleStockistList = [...visibleStockistMap.values()].sort((a, b) => (a.stockist_name || a.stockist_code || '').localeCompare(b.stockist_name || b.stockist_code || ''));
  const showStockistSelector = visibleStockistList.length > 1;
  if (stockistSelector) {
    const options = [];
    options.push(`<option value="all" ${selectedStockistCode === 'all' ? 'selected' : ''}>All stockists</option>`);
    visibleStockistList.forEach(row => {
      const code = normalizeEmpId(row.stockist_code);
      const name = (row.stockist_name || row.stockist_code || '').toString().trim();
      options.push(`<option value="${code}">${name}${row.stockist_code ? ` (${row.stockist_code})` : ''}</option>`);
    });
    stockistSelector.innerHTML = options.join('');
    if (selectedStockistCode !== 'all' && !visibleStockistMap.has(normalizeEmpId(selectedStockistCode))) {
      selectedStockistCode = 'all';
    }
    stockistSelector.value = selectedStockistCode;
    stockistSelector.style.display = visibleStockistList.length ? 'inline-block' : 'none';
    stockistSelector.disabled = !visibleStockistList.length;
  }
  const { data: clubRows, error: clubErr } = await sb.from('product_clubbing').select('raw_product_code, canonical_brand, canonical_product_code');
  if (clubErr) {
    body.innerHTML = `<div class="err">Failed to load product catalog: ${clubErr.message}</div>`;
    return;
  }
  const productMap = new Map();
  (clubRows || []).forEach(r => {
    const productName = (r.canonical_brand || r.raw_product_code || '').toString().trim();
    const productCode = (r.canonical_product_code || r.raw_product_code || productName || '').toString().trim();
    const key = normalizeEmpId(productName || productCode);
    if (!key || productMap.has(key)) return;
    productMap.set(key, {
      product_code: productCode,
      product_name: productName,
      brand: productName
    });
  });
  const productCatalog = [...productMap.values()].sort((a, b) => a.product_name.localeCompare(b.product_name));
  async function fetchAllSalesForMonth(year, month) {
    let allSales = [];
    let from = 0;
    while (true) {
      const { data, error } = await sb.from('sales')
        .select('id, period_year, period_month, distributor_code, stockist_code, stockist_name, hq_code, hq_name, mr_emp_id, raw_product_code, raw_product_name, brand, canonical_product_code, quantity, amount')
        .eq('period_year', year)
        .eq('period_month', month)
        .order('id', { ascending: true })
        .range(from, from + 999);
      if (error) {
        throw error;
      }
      allSales = allSales.concat(data || []);
      if (!data || data.length < 1000) break;
      from += 1000;
    }
    return allSales;
  }

  async function fetchAllSalesHistory() {
    let allSales = [];
    let from = 0;
    while (true) {
      const { data, error } = await sb.from('sales')
        .select('canonical_product_code, raw_product_code, raw_product_name, brand, quantity, amount')
        .order('id', { ascending: true })
        .range(from, from + 999);
      if (error) {
        throw error;
      }
      allSales = allSales.concat(data || []);
      if (!data || data.length < 1000) break;
      from += 1000;
    }
    return allSales;
  }

  let currentSales = [];
  try {
    const isCompanyOverall = selectedEmpId === 'overall' && (session.designation === 'ADMIN' || session.designation === 'VP');
    currentSales = (await fetchAllSalesForMonth(targetYear, targetMonth)).filter(r => (isCompanyOverall || visibleStockistMap.has(normalizeEmpId(r.stockist_code))) && r.brand !== 'HYGIENE_EXPIRY');
  } catch (error) {
    body.innerHTML = `<div class="err">Failed to load sales: ${error.message}</div>`;
    return;
  }
  let allSalesHistory = [];
  try {
    allSalesHistory = (await fetchAllSalesHistory()).filter(r => r.brand !== 'HYGIENE_EXPIRY');
  } catch (error) {
    console.warn("Failed to load historical sales for product rate fallback:", error);
  }
  const prevPeriod = prevFiscalPeriod(targetYear, targetMonth);

  function getSubtreeIds(rootId) {
    if (rootId === 'overall') return ['overall'];
    const ids = new Set([rootId]);
    let added;
    do {
      added = false;
      for (const e of allDownlineEmployees) {
        if (!ids.has(e.emp_id) && e.manager_emp_id && ids.has(e.manager_emp_id)) {
          ids.add(e.emp_id);
          added = true;
        }
      }
    } while (added);
    return Array.from(ids);
  }
  const queryScopeIds = [...new Set([...getSubtreeIds(scopeKey), 'overall'])];

  const [currentSavedResp, prevSavedAnyResp] = await Promise.all([
    (async () => {
      let all = [];
      const chunkSize = 50;
      const chunks = [];
      const stockistCodes = visibleStockists.map(r => r.stockist_code);
      for (let i = 0; i < stockistCodes.length; i += chunkSize) {
        chunks.push(stockistCodes.slice(i, i + chunkSize));
      }
      for (const chunk of chunks) {
        let from = 0;
        while (true) {
          const { data, error } = await sb.from('stock_statement_items')
            .select('stockist_code, product_code, scope_emp_id, opening_units, secondary_units, updated_at')
            .eq('period_year', targetYear)
            .eq('period_month', targetMonth)
            .in('stockist_code', chunk)
            .in('scope_emp_id', queryScopeIds)
            .order('stockist_code')
            .order('product_code')
            .range(from, from + 999);
          if (error) return { error };
          all = all.concat(data || []);
          if (!data || data.length < 1000) break;
          from += 1000;
        }
      }
      return { data: all };
    })(),
    (async () => {
      let all = [];
      const chunkSize = 50;
      const chunks = [];
      const stockistCodes = visibleStockists.map(r => r.stockist_code);
      for (let i = 0; i < stockistCodes.length; i += chunkSize) {
        chunks.push(stockistCodes.slice(i, i + chunkSize));
      }
      for (const chunk of chunks) {
        let from = 0;
        while (true) {
          const { data, error } = await sb.from('stock_statement_items')
            .select('stockist_code, product_code, scope_emp_id, closing_units, closing_value, sale_rate, opening_units, secondary_units')
            .eq('period_year', prevPeriod.year)
            .eq('period_month', prevPeriod.month)
            .in('stockist_code', chunk)
            .in('scope_emp_id', queryScopeIds)
            .order('stockist_code')
            .order('product_code')
            .range(from, from + 999);
          if (error) return { error };
          all = all.concat(data || []);
          if (!data || data.length < 1000) break;
          from += 1000;
        }
      }
      return { data: all };
    })()
  ]);
  if (currentSavedResp.error) {
    body.innerHTML = `<div class="err">Failed to load saved statement rows: ${currentSavedResp.error.message}</div>`;
    return;
  }
  if (prevSavedAnyResp.error) {
    body.innerHTML = `<div class="err">Failed to load previous month statement rows: ${prevSavedAnyResp.error.message}</div>`;
    return;
  }

  const currentSavedRows = currentSavedResp.data || [];
  const prevSavedAnyRows = prevSavedAnyResp.data || [];
  const currentSavedMap = new Map();
  for (const r of currentSavedRows) {
    const key = `${normalizeEmpId(r.stockist_code)}|${normalizeEmpId(r.product_code)}`;
    const existing = currentSavedMap.get(key);
    const isROverall = r.scope_emp_id === 'overall';
    const isEOverall = existing && existing.scope_emp_id === 'overall';
    const rTime = r.updated_at ? new Date(r.updated_at).getTime() : 0;
    const eTime = existing?.updated_at ? new Date(existing.updated_at).getTime() : 0;

    if (!existing) {
      currentSavedMap.set(key, { ...r, _scopes: [r.scope_emp_id] });
    } else if (!isROverall && !isEOverall) {
      // Both are BE-specific records
      if (rTime > eTime + 1000) {
        // Incoming is clearly newer — replace
        currentSavedMap.set(key, { ...r, _scopes: [r.scope_emp_id] });
      } else if (eTime > rTime + 1000) {
        // Existing is clearly newer — keep but add this scope
        existing._scopes = existing._scopes || [];
        if (!existing._scopes.includes(r.scope_emp_id)) existing._scopes.push(r.scope_emp_id);
      } else {
        // Same time — sum them (normal multi-BE roll-up)
        const acc = currentSavedMap.get(key);
        acc.opening_units = (parseFloat(acc.opening_units) || 0) + (parseFloat(r.opening_units) || 0);
        acc.secondary_units = (parseFloat(acc.secondary_units) || 0) + (parseFloat(r.secondary_units) || 0);
        acc.scope_emp_id = 'rolled_up';
        acc._scopes = acc._scopes || [];
        if (!acc._scopes.includes(r.scope_emp_id)) acc._scopes.push(r.scope_emp_id);
      }
    } else {
      // One or both are 'overall' — most recently saved wins
      if (rTime >= eTime) {
        currentSavedMap.set(key, { ...r, _scopes: [r.scope_emp_id] });
      }
    }
  }
  // Build prevSavedMap: for each stockist+product key, pick the row with the best (non-zero) closing_units
  // Prefer the same scope first, fall back to any scope — this ensures July sees June's closing regardless of scope
  const prevSavedAnyMap = new Map();
  for (const r of prevSavedAnyRows) {
    const k = `${normalizeEmpId(r.stockist_code)}|${normalizeEmpId(r.product_code)}`;
    const existing = prevSavedAnyMap.get(k);
    const closingVal = parseFloat(r.closing_units) || 0;
    const existingClosing = existing ? (parseFloat(existing.closing_units) || 0) : -1;
    // Prefer same-scope rows; among same scope prefer higher closing; prefer any non-zero over zero
    const preferThis = !existing
      || closingVal > existingClosing
      || (closingVal === existingClosing && r.scope_emp_id === 'overall');
    if (preferThis) prevSavedAnyMap.set(k, r);
  }
  // prevSavedMap = same as prevSavedAnyMap (scope-aware via above logic — no need for a separate scope-filtered query)
  const prevSavedMap = prevSavedAnyMap;

  const salesMap = new Map();
  const currentProductRateMap = new Map();
  const historicalProductRateMap = new Map();
  allSalesHistory.forEach(r => {
    const productKey = normalizeEmpId(r.canonical_product_code || r.raw_product_code || r.raw_product_name || r.brand);
    if (!productKey) return;
    const stats = historicalProductRateMap.get(productKey) || { units: 0, value: 0, rate: 0 };
    stats.units += parseFloat(r.quantity) || 0;
    stats.value += parseFloat(r.amount) || 0;
    stats.rate = stats.units > 0 ? (stats.value / stats.units) : stats.rate;
    historicalProductRateMap.set(productKey, stats);
  });
  currentSales.forEach(r => {
    const stockistCode = normalizeEmpId(r.stockist_code);
    const productCode = normalizeEmpId(r.canonical_product_code || r.raw_product_code || r.raw_product_name || r.brand);
    const key = `${stockistCode}|${productCode}`;
    const productKey = normalizeEmpId(r.canonical_product_code || r.raw_product_code || r.raw_product_name || r.brand);
    const mappingRow = visibleStockistMap.get(stockistCode) || {};
    const productName = (r.raw_product_name || r.brand || r.canonical_product_code || r.raw_product_code || productCode || '').toString().trim();
    if (!salesMap.has(key)) {
      salesMap.set(key, {
        stockist_code: stockistCode,
        stockist_name: (mappingRow.stockist_name || r.stockist_name || stockistCode || '').toString().trim(),
        product_code: productCode,
        product_name: productName,
        brand: (r.brand || productName || '').toString().trim(),
        primary_units: 0,
        primary_value: 0,
        sale_rate: 0
      });
    }
    const item = salesMap.get(key);
    item.primary_units += parseFloat(r.quantity) || 0;
    item.primary_value += parseFloat(r.amount) || 0;
    item.product_name = productName || item.product_name;
    item.brand = (r.brand || item.brand || productName || '').toString().trim();
    item.sale_rate = item.primary_units > 0 ? (item.primary_value / item.primary_units) : item.sale_rate;

    if (productKey) {
      const stats = currentProductRateMap.get(productKey) || { units: 0, value: 0, rate: 0 };
      stats.units += parseFloat(r.quantity) || 0;
      stats.value += parseFloat(r.amount) || 0;
      stats.rate = stats.units > 0 ? (stats.value / stats.units) : stats.rate;
      currentProductRateMap.set(productKey, stats);
    }
  });

  window.productRateMap = currentProductRateMap;

  let stockistCatalog = visibleStockistList;

  // Dynamically append any unmapped products found in sales so they are not dropped from the Stock Statement!
  const knownProducts = new Set(productCatalog.map(p => normalizeEmpId(p.product_code)));
  const unmappedProductsMap = new Map();
  salesMap.forEach(s => {
    const pCode = normalizeEmpId(s.product_code);
    if (!knownProducts.has(pCode)) {
      unmappedProductsMap.set(pCode, {
        product_code: s.product_code,
        product_name: s.product_name || s.product_code || 'UNKNOWN',
        brand: s.brand || '-'
      });
    }
  });
  productCatalog.push(...Array.from(unmappedProductsMap.values()));

  // Dynamically append any unmapped stockists found in sales so they are not dropped from the Stock Statement!
  if (selectedEmpId === 'overall') {
    const knownCodes = new Set(stockistCatalog.map(s => normalizeEmpId(s.stockist_code)));
    const unmapped = new Map();
    salesMap.forEach(s => {
      const c = normalizeEmpId(s.stockist_code);
      if (!knownCodes.has(c)) {
        unmapped.set(c, {
          stockist_code: s.stockist_code,
          stockist_name: s.stockist_name || 'Unmapped Stockist',
          hq_name: s.hq_name || 'UNKNOWN'
        });
      }
    });
    stockistCatalog = stockistCatalog.concat(Array.from(unmapped.values()));
  }

  if (selectedStockistCode !== 'all') {
    stockistCatalog = stockistCatalog.filter(row => normalizeEmpId(row.stockist_code) === normalizeEmpId(selectedStockistCode));
  }
  const isFirstMonth = targetYear === STOCK_FIRST_YEAR && targetMonth === STOCK_FIRST_MONTH;
  // Opening editable ONLY if admin opened Opening edit
  const canEditOpening = stockOpeningEditOpen;
  // Secondary editable ONLY if admin opened Secondary edit
  const canEditSecondary = stockSecondaryEditOpen;
  const groups = stockistCatalog.map(stockistRow => {
    const stockistCode = normalizeEmpId(stockistRow.stockist_code);
    const stockistName = (stockistRow.stockist_name || stockistRow.stockist_code || '').toString().trim();
    
    const beEmpId = normalizeEmpId(stockistRow.be_emp_id_1 || '');
    const beEmployee = allDownlineEmployees.find(e => normalizeEmpId(e.emp_id) === beEmpId) || {};
    const beName = beEmployee.name ? `${beEmployee.name} (${beEmpId})` : beEmpId;
    const hqName = stockistRow.hq_name || beEmployee.hq_name || '';
    const state = beEmployee.state || stockistRow.state || '';

    const rows = productCatalog.map(product => {
      const key = `${stockistCode}|${normalizeEmpId(product.product_code)}`;
      const sales = salesMap.get(key) || null;
      const saved = currentSavedMap.get(key) || null;
      const prevSaved = prevSavedMap.get(key) || null;
      const prevAnySaved = prevSavedAnyMap.get(key) || null;
      // Opening for non-first months: ALWAYS derive from previous month's actual closing.
      // This prevents stale carry-forward data from causing wrong (e.g. negative) openings.
      // For the first month (June 2026), use the saved opening or 0.
      let openingUnits;
      if (isFirstMonth) {
        // First month: use saved opening if explicitly stored, else 0
        openingUnits = (saved && saved.opening_units != null)
          ? (parseFloat(saved.opening_units) || 0)
          : 0;
      } else {
        // Non-first months calculate carry-forward from previous month
        let carryForward = 0;
        if (prevSaved && prevSaved.closing_units != null) {
          carryForward = Math.max(0, parseFloat(prevSaved.closing_units) || 0);
        } else if (prevAnySaved && prevAnySaved.closing_units != null) {
          carryForward = Math.max(0, parseFloat(prevAnySaved.closing_units) || 0);
        }
        
        if (canEditOpening && saved && saved.opening_units != null) {
          // Admin unlocked Opening Edit for this month: explicitly prioritize the saved manual entry
          openingUnits = parseFloat(saved.opening_units) || 0;
        } else if (prevSaved || prevAnySaved) {
          // Locked, or unlocked but nothing saved yet: strictly enforce carry-forward
          openingUnits = carryForward;
        } else if (saved && saved.opening_units != null) {
          // Fallback: no previous month data exists at all
          openingUnits = parseFloat(saved.opening_units) || 0;
        } else {
          openingUnits = 0;
        }
      }
      const primaryUnits = sales ? sales.primary_units : 0;
      const rawPrimaryValue = sales ? sales.primary_value : 0;
      const productKey = normalizeEmpId(product.product_code);
      const currentRate = currentProductRateMap.get(productKey) || null;
      const historicalRate = historicalProductRateMap.get(productKey) || null;
      const savedRate = saved && saved.sale_rate != null ? parseFloat(saved.sale_rate) : null;
      const prevSavedRate = prevSaved && prevSaved.sale_rate != null ? parseFloat(prevSaved.sale_rate) : null;
      const marketRate = currentRate?.rate || historicalRate?.rate || 0;
      
      // Use the uniform market rate from product master to ensure identical saleRate across all months
      const saleRate = marketRate;
      
      // Use the raw primary value directly from sales to guarantee exact matching with Excel upload
      const primaryValue = rawPrimaryValue;
      const totalUnits = openingUnits + primaryUnits;
      const secondaryUnits = saved && saved.secondary_units != null ? parseFloat(saved.secondary_units) || 0 : 0;
      // Opening value is always based on opening units and the consistent saleRate
      const openingValue = openingUnits * saleRate;
      const secondaryValue = secondaryUnits * saleRate;
      const closingUnits = totalUnits - secondaryUnits;
      const closingValue = closingUnits * saleRate;
      // Opening editable: first month OR admin unlocked opening
      // Secondary editable: first month OR admin unlocked secondary (independent)
      const openingEditable = canEditOpening;
      const secondaryEditable = canEditSecondary;
      // Always show the computed openingUnits in the field (even when disabled/read-only)
      // so July correctly pre-fills from June's closing
      const openingDisplay = openingUnits;
      const secondaryDisplay = secondaryUnits > 0 ? secondaryUnits : (saved ? 0 : '');
      return {
        stockist_code: stockistCode,
        stockist_name: (sales?.stockist_name || saved?.stockist_name || stockistName || '').toString().trim(),
        beName,
        hqName,
        state,
        product_code: product.product_code,
        product_name: product.product_name,
        brand: product.brand,
        openingUnits,
        openingValue,
        primaryUnits,
        primaryValue,
        saleRate,
        totalUnits,
        secondaryUnits,
        secondaryValue,
        closingUnits,
        closingValue,
        openingEditable,
        secondaryEditable,
        openingDisplay,
        secondaryDisplay,
        saved: !!saved,
        contributingScopes: saved?._scopes || (saved ? [saved.scope_emp_id] : []),
        key
      };
    }).sort((a, b) => a.product_name.localeCompare(b.product_name));
    return { stockist_code: stockistCode, stockist_name: stockistName, rows };
  });

  const rows = groups.flatMap(g => g.rows);

  const grandTotals = rows.reduce((acc, row) => {
    acc.openingUnits += row.openingUnits || 0;
    acc.openingValue += row.openingValue || 0;
    acc.primaryUnits += row.primaryUnits || 0;
    acc.primaryValue += row.primaryValue || 0;
    acc.secondaryUnits += row.secondaryUnits || 0;
    acc.secondaryValue += row.secondaryValue || 0;
    acc.closingUnits += row.closingUnits || 0;
    acc.closingValue += row.closingValue || 0;
    return acc;
  }, { openingUnits: 0, openingValue: 0, primaryUnits: 0, primaryValue: 0, secondaryUnits: 0, secondaryValue: 0, closingUnits: 0, closingValue: 0 });

  const grandSaleRate = grandTotals.primaryUnits > 0 ? grandTotals.primaryValue / grandTotals.primaryUnits : 0;
  lastStockStatementData = {
    rows,
    groups,
    scopeEmpId: scopeKey,
    year: targetYear,
    month: targetMonth,
    grandTotals: { ...grandTotals, saleRate: grandSaleRate, stockist_count: groups.length },
    context: { scopeKey, targetYear, targetMonth }
  };

  if (rows.length === 0) {
    body.innerHTML = `<p class="muted">No visible stockists or sales rows found for this month.</p>`;
    return;
  }

  const headerMonth = `${monthLabel(targetMonth)} ${targetYear + (targetMonth >= 10 ? 1 : 0)}`;
  body.innerHTML = `
    <div class="small" style="margin-bottom:12px;">Scope: <b>${scopeName}</b> | Month: <b>${headerMonth}</b></div>
    <div class="kpi-row" style="margin-bottom:16px;">
      <div class="kpi"><div class="label">Opening Value</div><div class="value">${fmtCurrency(grandTotals.openingValue)}</div><div class="sub">${fmtNum(grandTotals.openingUnits)} units</div></div>
      <div class="kpi"><div class="label">Primary Sales Value</div><div class="value">${fmtCurrency(grandTotals.primaryValue)}</div><div class="sub">${fmtNum(grandTotals.primaryUnits)} units</div></div>
      <div class="kpi"><div class="label">Secondary Value</div><div class="value">${fmtCurrency(grandTotals.secondaryValue)}</div><div class="sub">${fmtNum(grandTotals.secondaryUnits)} units</div></div>
      <div class="kpi"><div class="label">Closing Value</div><div class="value">${fmtCurrency(grandTotals.closingValue)}</div><div class="sub">${fmtNum(grandTotals.closingUnits)} units</div></div>
    </div>
    <div style="overflow-x:auto;">
      <table class="stock-table" style="min-width:1450px; width:100%;">
        <thead>
          <tr>
            <th>Stockist</th>
            <th>Product</th>
            <th class="num">Opening<br>(Units)</th>
            <th class="num">Primary Sales<br>(Units)</th>
            <th class="num">Primary Sales<br>(Value)</th>
            <th class="num">Sale Rate</th>
            <th class="num" id="stockTotalHdr">Total<br>(Units)</th>
            <th class="num">Secondary Sales<br>(Units)</th>
            <th class="num">Secondary Sales<br>(Value)</th>
            <th class="num">Closing<br>(Units)</th>
            <th class="num">Closing<br>(Value)</th>
          </tr>
        </thead>
        <tbody>
          ${groups.map(group => {
            const groupTotals = group.rows.reduce((acc, row) => {
              acc.openingUnits += row.openingUnits || 0;
              acc.primaryUnits += row.primaryUnits || 0;
              acc.primaryValue += row.primaryValue || 0;
              acc.secondaryUnits += row.secondaryUnits || 0;
              acc.secondaryValue += row.secondaryValue || 0;
              acc.closingUnits += row.closingUnits || 0;
              acc.closingValue += row.closingValue || 0;
              return acc;
            }, { openingUnits: 0, primaryUnits: 0, primaryValue: 0, secondaryUnits: 0, secondaryValue: 0, closingUnits: 0, closingValue: 0 });
            return `${group.rows.map(row => {
              const rowKey = statementDomKey(row.stockist_code, row.product_code);
              const closingNegative = row.closingUnits < 0;
              return `<tr id="stockRow_${rowKey}">
                <td>
                  <div class="row-head">${row.stockist_name}</div>
                  <div class="row-sub">${row.stockist_code}</div>
                </td>
                <td>
                  <div class="row-head">${row.product_name}</div>
                  <div class="row-sub">${row.brand || row.product_code}</div>
                </td>
                <td class="num">
                  <input id="stockOpening_${rowKey}" class="stock-input" type="number" step="0.01" min="0" autocomplete="off" value="${row.openingDisplay}" ${row.openingEditable ? 'placeholder="Enter qty"' : 'disabled title="Opening is auto-filled from previous month closing. Admin can unlock via Edit Window."'} data-primary="${row.primaryUnits}" data-salerate="${row.saleRate}" data-rowkey="${rowKey}" />
                </td>
                <td class="num">${fmtNum(row.primaryUnits)}</td>
                <td class="num">${fmtCurrency(row.primaryValue)}</td>
                <td class="num">${row.saleRate ? fmtCurrency(row.saleRate) : '₹0'}</td>
                <td class="num" id="stockTotal_${rowKey}">${fmtNum(row.totalUnits)}</td>
                <td class="num">
                  <input id="stockSecondary_${rowKey}" class="stock-input" type="number" step="0.01" min="0" value="${row.secondaryDisplay}" ${row.secondaryEditable ? 'placeholder="Enter units"' : 'disabled title="Secondary Sales locked. Admin can unlock via Edit Window."'} data-rowkey="${rowKey}" />
                </td>
                <td class="num" id="stockSecVal_${rowKey}">${fmtCurrency(row.secondaryValue)}</td>
                <td class="num" id="stockClosingU_${rowKey}" style="${closingNegative ? 'color:var(--bad);font-weight:600;' : ''}">${closingNegative ? '⚠ ' : ''}${fmtNum(row.closingUnits)}</td>
                <td class="num" id="stockClosingV_${rowKey}" style="${closingNegative ? 'color:var(--bad);' : ''}">${fmtCurrency(row.closingValue)}</td>
              </tr>`;
            }).join('')}
            <tr class="stock-total-row">
              <td><span class="total-chip">Subtotal</span> ${group.stockist_name}</td>
              <td>All products</td>
              <td class="num">${fmtNum(groupTotals.openingUnits)}</td>
              <td class="num">${fmtNum(groupTotals.primaryUnits)}</td>
              <td class="num">${fmtCurrency(groupTotals.primaryValue)}</td>
              <td class="num"></td>
              <td class="num"></td>
              <td class="num">${fmtNum(groupTotals.secondaryUnits)}</td>
              <td class="num">${fmtCurrency(groupTotals.secondaryValue)}</td>
              <td class="num">${fmtNum(groupTotals.closingUnits)}</td>
              <td class="num">${fmtCurrency(groupTotals.closingValue)}</td>
            </tr>`;
          }).join('')}
          <tr class="stock-total-row">
            <td><span class="total-chip">Grand Total</span></td>
            <td>All stockists / all products</td>
            <td class="num">${fmtNum(grandTotals.openingUnits)}</td>
            <td class="num">${fmtNum(grandTotals.primaryUnits)}</td>
            <td class="num">${fmtCurrency(grandTotals.primaryValue)}</td>
            <td class="num"></td>
            <td class="num"></td>
            <td class="num">${fmtNum(grandTotals.secondaryUnits)}</td>
            <td class="num">${fmtCurrency(grandTotals.secondaryValue)}</td>
            <td class="num">${fmtNum(grandTotals.closingUnits)}</td>
            <td class="num">${fmtCurrency(grandTotals.closingValue)}</td>
          </tr>
        </tbody>
      </table>
    </div>
    <div class="stock-note">
      ${isFirstMonth
        ? '<b style="color:var(--accent);">&#10003; June 2026 (First Month):</b> Enter the <b>Opening Qty</b> and <b>Secondary Sales</b> units for each product. Click <b>Save All Entries</b> when done.'
        : (() => {
            const parts = [];
            if (canEditOpening) parts.push('<span style="color:var(--accent);">&#9998; <b>Opening Qty unlocked</b> (Admin)</span>');
            else parts.push('<span>&#128274; Opening locked (auto-filled from prev. closing)</span>');
            if (canEditSecondary) parts.push('<span style="color:var(--good);">&#9998; <b>Secondary Sales unlocked</b> (Admin)</span>');
            else parts.push('<span>&#128274; Secondary locked</span>');
            return parts.join(' &nbsp;|&nbsp; ') + '. ' + (canEditOpening || canEditSecondary ? 'Click <b>Save All Entries</b> when done.' : 'Use the <b>Edit Opening</b> / <b>Edit Secondary</b> toolbar buttons to unlock.');
          })()
      }
    </div>
  `;

  // Wire up live-preview: recalculate Total/Closing in the row as user types opening or secondary
  function fmtNumSimple(v) { return Number.isFinite(v) ? (Math.round(v * 100) / 100).toLocaleString('en-IN') : '0'; }
  groups.forEach(group => {
    group.rows.forEach(row => {
      const rowKey = statementDomKey(row.stockist_code, row.product_code);
      const openingInput = document.getElementById(`stockOpening_${rowKey}`);
      const secondaryInput = document.getElementById(`stockSecondary_${rowKey}`);
      const totalCell = document.getElementById(`stockTotal_${rowKey}`);
      const closingUCell = document.getElementById(`stockClosingU_${rowKey}`);
      const closingVCell = document.getElementById(`stockClosingV_${rowKey}`);
      const secValCell = document.getElementById(`stockSecVal_${rowKey}`);

      function updateRowCalc() {
        const openingVal = row.openingEditable ? (parseFloat(openingInput?.value) || 0) : row.openingUnits;
        const secondaryVal = row.secondaryEditable ? (parseFloat(secondaryInput?.value) || 0) : row.secondaryUnits;
        const total = openingVal + row.primaryUnits;
        const closing = total - secondaryVal;
        const saleRate = row.saleRate || 0;
        if (totalCell) totalCell.textContent = fmtNumSimple(total);
        if (secValCell) secValCell.textContent = '\u20b9' + fmtNumSimple(secondaryVal * saleRate);
        if (closingUCell) {
          closingUCell.textContent = (closing < 0 ? '\u26a0 ' : '') + fmtNumSimple(closing);
          closingUCell.style.color = closing < 0 ? 'var(--bad)' : '';
          closingUCell.style.fontWeight = closing < 0 ? '600' : '';
        }
        if (closingVCell) {
          closingVCell.textContent = '\u20b9' + fmtNumSimple(closing * saleRate);
          closingVCell.style.color = closing < 0 ? 'var(--bad)' : '';
        }
      }

      if (openingInput && row.openingEditable) {
        openingInput.addEventListener('input', () => { isStockStatementDirty = true; updateRowCalc(); window.triggerAutoSave(); });
      }
      if (secondaryInput && row.secondaryEditable) {
        secondaryInput.addEventListener('input', () => { isStockStatementDirty = true; updateRowCalc(); window.triggerAutoSave(); });
      }
    });
  });
}

async function handleExpiryUpload(e) {
  const file = e.target.files[0];
  if(!file) return;
  const pYear = parseInt(document.getElementById("expiryYear").value, 10);
  const pMonth = parseInt(document.getElementById("expiryMonth").value, 10);
  
  const status = document.getElementById("expiryUpStatus");
  status.style.display = 'block';
  status.textContent = "Reading Expiry file...";
  
  const reader = new FileReader();
  reader.onload = async (evt) => {
    try {
      const data = new Uint8Array(evt.target.result);
      const workbook = XLSX.read(data, {type: 'array'});
      const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(firstSheet, {header: 1, defval: ""});
      
      status.textContent = "Parsing Expiry data...";
      let headerIdx = -1;
      let stockistCol = -1;
      let altStockistCol = -1;
      let grossValCol = -1;
      
      for(let i = 0; i < Math.min(20, rows.length); i++) {
        const row = rows[i];
        if (row.includes("Gross Value")) {
          headerIdx = i;
          grossValCol = row.indexOf("Gross Value");
          stockistCol = row.indexOf("Cust Erp/Sap Code");
          altStockistCol = row.indexOf("Code");
          if(stockistCol === -1) stockistCol = altStockistCol;
          break;
        }
      }
      
      if(headerIdx === -1 || stockistCol === -1 || grossValCol === -1) {
        throw new Error("Could not find required columns ('Cust Erp/Sap Code' / 'Code' and 'Gross Value').");
      }
      
      const stockistAgg = {};
      for(let i = headerIdx + 1; i < rows.length; i++) {
        const row = rows[i];
        if (!row || row.length === 0) continue;
        const rawSCode = row[stockistCol] || (altStockistCol !== -1 ? row[altStockistCol] : "");
        const sCode = String(rawSCode).trim();
        const val = parseFloat(row[grossValCol]);
        if (sCode && !isNaN(val)) {
          stockistAgg[sCode] = (stockistAgg[sCode] || 0) + val;
        }
      }
      
      const out = [];
      // Use pYear and pMonth from the outer scope (which read from expiryYear and expiryMonth)

      
      for (const sCode in stockistAgg) {
        out.push({
          period_year: pYear,
          period_month: pMonth,
          stockist_code: sCode,
          hq_code: 'EXP',
          hq_name: 'EXPIRY',
          brand: 'HYGIENE_EXPIRY',
          canonical_product_code: 'EXPIRY',
          quantity: 1,
          amount: stockistAgg[sCode],
          uploaded_by: session.emp_id,
          bill_date: `${pYear}-01-01`
        });
      }
      
      if (out.length === 0) {
        status.innerHTML = "No valid expiry data found.";
        return;
      }
      
      const progBar = document.getElementById("expiryProgBar");
      progBar.style.width = '70%';
      status.textContent = "Clearing existing expiry for selected period...";
      
      await sb.from('sales')
        .delete()
        .eq('period_year', pYear)
        .eq('period_month', pMonth)
        .eq('brand', 'HYGIENE_EXPIRY');
        
      status.textContent = "Uploading expiry data...";
      
      const batchSize = 500;
      for (let i = 0; i < out.length; i += batchSize) {
        const batch = out.slice(i, i + batchSize);
        const { error } = await sb.from('sales').insert(batch);
        if (error) { status.textContent = "Error: " + error.message; return; }
        progBar.style.width = Math.round(70 + ((i+batch.length)/out.length)*30) + "%";
      }
      
      status.innerHTML = `<span style="color:var(--good);font-weight:600;">Done.</span> Uploaded Expiry data for ${out.length} BEs.`;
      loadUploadedFiles();
      e.target.value = ""; // clear input
    } catch(err) {
      console.error(err);
      status.innerHTML = `<span style="color:var(--danger)">Error: ${err.message}</span>`;
      e.target.value = "";
    }
  };
  reader.readAsArrayBuffer(file);
}

    // Gather all inputs

    const records = [];
    inputs.forEach(inp => {
      const pCode = inp.id.replace('fc_', '');
      const val = parseFloat(inp.value) || 0;
      records.push({
        period_year: pYear,
        period_month: pMonth,
        emp_id: session.emp_id,
        product_code: pCode,
        forecast_units: val
      });
    });

    if (records.length === 0) {
      alert("No products to save.");
      btnSave.textContent = "Submit Final Forecast";
      btnSave.disabled = false;
      return;
    }

    // Delete existing forecast for this user/month to replace
    await sb.from('cfa_forecasts')
      .delete()
      .eq('period_year', pYear)
      .eq('period_month', pMonth)
      .eq('emp_id', session.emp_id);

    // Insert new
    const { error } = await sb.from('cfa_forecasts').insert(records);
    
    if (error) {
      alert("Error saving forecast: " + error.message);
    } else {
      alert("Forecast successfully saved to database!");
      loadForecastData(); // Reload to refresh status
    }
    
    btnSave.textContent = "Submit Final Forecast";
    btnSave.disabled = false;
  };
  
  // Auto-load
  loadForecastData();
}

function parseBillDate(val) {
  if (!val) return null;
  if (val instanceof Date && !isNaN(val.getTime())) {
    // SheetJS cellDates parses dates as UTC. Use UTC methods to avoid timezone shift.
    return new Date(val.getUTCFullYear(), val.getUTCMonth(), val.getUTCDate(), 12, 0, 0);
  }
  const str = val.toString().trim();
  if (/^\d+(\.\d+)?$/.test(str)) {
    const num = parseFloat(str);
    const d = new Date((num - 25569) * 86400 * 1000);
    if (!isNaN(d.getTime())) {
      return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), 12, 0, 0);
    }
  }
  let parts = str.split(/[-/.]/);
  if (parts.length === 3) {
    if (parts[0].length === 4) {
      const d = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]), 12, 0, 0);
      if (!isNaN(d.getTime())) return d;
    } else {
      const d = new Date(parseInt(parts[2]), parseInt(parts[1]) - 1, parseInt(parts[0]), 12, 0, 0);
      if (!isNaN(d.getTime())) return d;
    }
  }
  const d = new Date(str);
  if (!isNaN(d.getTime())) {
    return new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12, 0, 0);
  }
  return null;
}

async function handleUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("upStatus");
  const progBar = document.getElementById("progBar");
  const period_month = parseInt(document.getElementById("upMonth").value);
  const period_year = parseInt(document.getElementById("upYear").value);

  status.textContent = "Reading file…";
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets["Report"] || wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws, { header: 1, defval: null });

  // locate header row dynamically (column containing "Distributor Code" or similar)
  let headerIdx = rows.findIndex(r => r && r.some(c => c && ["DISTRIBUTOR CODE", "STOCKIST CODE", "PERIOD_YEAR"].includes(c.toString().trim().toUpperCase())));
  if (headerIdx === -1) { status.textContent = "Could not find header row — check file format."; return; }

  const headersRow = rows[headerIdx];
  const findColIdx = (names) => {
    // exact match first
    let idx = headersRow.findIndex(h => {
      if (h === null || h === undefined) return false;
      const val = h.toString().trim().toUpperCase();
      return names.some(n => val === n.toUpperCase());
    });
    if (idx !== -1) return idx;
    // partial match fallback
    return headersRow.findIndex(h => {
      if (h === null || h === undefined) return false;
      const val = h.toString().trim().toUpperCase();
      return names.some(n => val.includes(n.toUpperCase()));
    });
  };

  const colDistributorCode = findColIdx(["Distributor Code", "Distributor", "period_year"]); 
  const colStockistCode = findColIdx(["Stockist Code", "Stockist_Code", "Stk Code"]);
  const colStockistName = findColIdx(["Stockist Name", "Stockist_Name", "Stk Name"]);
  const colBillDate = findColIdx(["Bill Date", "Invoice Date", "bill_date", "Date"]);
  const colHqCode = findColIdx(["HQ Code", "hq_code", "Hq Code"]);
  const colHqName = findColIdx(["HQ Name", "hq_name", "Hq Name"]);
  const colMrEmpId = findColIdx(["MR Code", "mr_emp_id", "MR Emp ID", "Emp Code"]);
  const colMrName = findColIdx(["MR Name", "mr_name", "Emp Name"]);
  const colRawProductCode = findColIdx(["Product Code", "raw_product_code", "Item Code"]);
  const colRawProductName = findColIdx(["Product Name", "raw_product_name", "Item Name"]);
  const colQuantity = findColIdx(["Quantity", "quantity", "Qty", "Billed Qty"]);
  const colFreeQty = findColIdx(["Free Qty", "free qty", "Free", "Free Quantity"]);
  const colAmount = findColIdx(["Amount", "amount", "Value", "Net Amount"]);

  if (colStockistCode === -1 || colAmount === -1) {
    status.textContent = "Could not find essential columns (Stockist Code & Amount) in header row.";
    return;
  }

  status.textContent = "Loading product clubbing table…";
  const { data: clubbing } = await sb.from('product_clubbing').select('*');
  const clubMap = {};
  (clubbing||[]).forEach(c => clubMap[c.raw_product_code] = c);

  const dataRows = rows.slice(headerIdx + 1).filter(r => r && (r[colDistributorCode !== -1 ? colDistributorCode : 0] || r[colStockistCode]));
  status.textContent = `Parsing ${dataRows.length} rows…`;

  const out = [];
  const periodsToClear = new Set();
  for (const r of dataRows) {
    const quantity = colQuantity !== -1 ? parseFloat(r[colQuantity]) || 0 : 0;
    const freeQty = colFreeQty !== -1 ? parseFloat(r[colFreeQty]) || 0 : 0;
    const amount = colAmount !== -1 ? r[colAmount] : 0;
    if (quantity === 0 && freeQty === 0 && amount == null) continue;
    
    const rawCode = colRawProductCode !== -1 ? (r[colRawProductCode]||"").toString().trim() : "";
    const club = clubMap[rawCode];
    const rawDateVal = colBillDate !== -1 ? r[colBillDate] : null;
    const parsedDate = parseBillDate(rawDateVal);
    
    let r_month = period_month;
    let r_year = period_year;
    
    if (parsedDate) {
      r_month = getFiscalMonthNum(parsedDate);
      r_year = getFiscalYearStart(parsedDate);
    }
    
    periodsToClear.add(`${r_year}-${r_month}`);
    
    if (quantity > 0 || amount != null) {
      out.push({
        period_year: r_year,
        period_month: r_month,
        bill_date: parsedDate ? `${parsedDate.getFullYear()}-${String(parsedDate.getMonth()+1).padStart(2,'0')}-${String(parsedDate.getDate()).padStart(2,'0')}` : null,
        distributor_code: colDistributorCode !== -1 ? (r[colDistributorCode] || '').toString().trim() : null,
        stockist_code: colStockistCode !== -1 ? (r[colStockistCode]||"").toString().trim() : null,
        stockist_name: colStockistName !== -1 ? r[colStockistName] : null,
        hq_code: colHqCode !== -1 ? (r[colHqCode]||"").toString().trim() : null,
        hq_name: colHqName !== -1 ? r[colHqName] : null,
        mr_emp_id: colMrEmpId !== -1 ? r[colMrEmpId] : null,
        mr_name: colMrName !== -1 ? r[colMrName] : null,
        raw_product_code: rawCode,
        raw_product_name: colRawProductName !== -1 ? r[colRawProductName] : null,
        brand: club ? club.canonical_brand : (colRawProductName !== -1 ? r[colRawProductName] : null),
        canonical_product_code: club ? club.canonical_product_code : rawCode,
        quantity: quantity,
        amount: parseFloat(amount)||0,
        uploaded_by: session.emp_id,
      });
    }

    if (freeQty > 0) {
      out.push({
        period_year: r_year,
        period_month: r_month,
        bill_date: parsedDate ? `${parsedDate.getFullYear()}-${String(parsedDate.getMonth()+1).padStart(2,'0')}-${String(parsedDate.getDate()).padStart(2,'0')}` : null,
        distributor_code: colDistributorCode !== -1 ? (r[colDistributorCode] || '').toString().trim() : null,
        stockist_code: colStockistCode !== -1 ? (r[colStockistCode]||"").toString().trim() : null,
        stockist_name: colStockistName !== -1 ? r[colStockistName] : null,
        hq_code: colHqCode !== -1 ? (r[colHqCode]||"").toString().trim() : null,
        hq_name: colHqName !== -1 ? r[colHqName] : null,
        mr_emp_id: colMrEmpId !== -1 ? r[colMrEmpId] : null,
        mr_name: colMrName !== -1 ? r[colMrName] : null,
        raw_product_code: rawCode ? rawCode + "-FREE" : "-FREE",
        raw_product_name: colRawProductName !== -1 && r[colRawProductName] ? r[colRawProductName] + " (FREE)" : null,
        brand: club && club.canonical_brand ? club.canonical_brand + " (FREE)" : (colRawProductName !== -1 && r[colRawProductName] ? r[colRawProductName] + " (FREE)" : "(FREE)"),
        canonical_product_code: club ? club.canonical_product_code : rawCode,
        quantity: freeQty,
        amount: 0,
        uploaded_by: session.emp_id,
      });
    }
  }

  status.textContent = "Clearing existing sales data for periods in the uploaded file…";
  for (const p of periodsToClear) {
    const [y, m] = p.split("-").map(Number);
    const { error: clearError } = await sb.from('sales')
      .delete()
      .eq('period_year', y)
      .eq('period_month', m)
      .neq('brand', 'HYGIENE_EXPIRY');
    if (clearError) {
      console.warn(`Could not clear sales data for period ${y}-${m}:`, clearError.message);
    }
  }

  status.textContent = `Uploading ${out.length} rows to Supabase…`;
  const batchSize = 500;
  for (let i = 0; i < out.length; i += batchSize) {
    const batch = out.slice(i, i + batchSize);
    const { error } = await sb.from('sales').insert(batch);
    if (error) { status.textContent = "Error: " + error.message; return; }
    progBar.style.width = Math.round(((i+batch.length)/out.length)*100) + "%";
  }
  status.innerHTML = `<span style="color:var(--good);font-weight:600;">Done.</span> Uploaded ${out.length} sales rows.`;
  loadUploadedFiles();
}

async function loadUploadedFiles() {
  const tbody = document.getElementById("uploadsList");
  if (!tbody) return;

  // Try RPC first
  let { data, error } = await sb.rpc('get_uploaded_files');
  
  if (error) {
    console.warn("RPC get_uploaded_files failed, falling back to client-side grouping...", error);
    // Fallback: Fetch all uploaded_at, period_year, period_month, amount, uploaded_by from sales
    const { data: rawSales, error: rawError } = await sb.from('sales')
      .select('uploaded_at, period_year, period_month, amount, uploaded_by')
      .order('id', { ascending: false })
      .limit(1000);
    if (rawError) {
      tbody.innerHTML = `<tr><td colspan="6" class="err">Error loading uploads: ${rawError.message}</td></tr>`;
      return;
    }
    
    // Group in JS
    const groups = {};
    (rawSales || []).forEach(r => {
      if (!r.uploaded_at) return;
      const key = r.uploaded_at.substring(0, 16); // YYYY-MM-DD HH:MM
      if (!groups[key]) {
        groups[key] = {
          upload_group_id: key,
          period_year: r.period_year,
          period_month: r.period_month,
          row_count: 0,
          total_amount: 0.0,
          uploaded_at: r.uploaded_at,
          uploaded_by: r.uploaded_by
        };
      }
      groups[key].row_count++;
      groups[key].total_amount += parseFloat(r.amount) || 0;
    });
    data = Object.values(groups).sort((a, b) => b.uploaded_at.localeCompare(a.uploaded_at));
  }

  if (!data || data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="6" class="muted" style="text-align:center;padding:12px;">No uploads found.</td></tr>`;
    return;
  }

  tbody.innerHTML = data.map(u => {
    const formattedDate = new Date(u.uploaded_at).toLocaleString();
    const calYear = u.period_month >= 10 ? u.period_year + 1 : u.period_year;
    const periodStr = `${monthLabel(u.period_month)} ${calYear}`;
    const amtStr = (u.total_amount || 0).toLocaleString('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 });
    return `
      <tr>
        <td>${formattedDate}</td>
        <td><b>${periodStr}</b></td>
        <td class="num">${u.row_count}</td>
        <td class="num" style="font-weight:600;">${amtStr}</td>
        <td>${u.uploaded_by || '—'}</td>
        <td style="text-align:center;">
          <button class="btn-ghost" style="color:var(--bad); border-color:var(--bad); padding:4px 8px; font-size:12px;" onclick="deleteUploadGroup('${u.upload_group_id}')">Delete</button>
        </td>
      </tr>
    `;
  }).join("");
}

async function deleteUploadGroup(groupId) {
  if (!confirm(`Are you sure you want to delete all sales records from this upload (${groupId})?`)) return;
  
  // Try RPC first
  const { error } = await sb.rpc('delete_upload_group', { p_upload_group_id: groupId });
  
  if (error) {
    console.warn("RPC delete_upload_group failed, falling back to direct delete...", error);
    // Direct delete fallback
    const { error: delError } = await sb.from('sales')
      .delete()
      .gte('uploaded_at', `${groupId}:00`)
      .lte('uploaded_at', `${groupId}:59`);
      
    if (delError) {
      alert("Failed to delete upload group: " + delError.message);
      return;
    }
  }
  
  alert("Successfully deleted upload group.");
  loadUploadedFiles();
}

window.deleteUploadGroup = deleteUploadGroup;

async function handleEmployeeUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("empUpStatus");
  const progBar = document.getElementById("empProgBar");

  status.textContent = "Reading file…";
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws);

  if (rows.length === 0) {
    status.textContent = "The file is empty.";
    return;
  }

  // Normalize column names: lowercase + trim, and fix known typos
  const normalizeKey = k => k.toString().toLowerCase().trim().replace(/\s+/g,'_');
  const keyMap = {}; // normalized -> original
  Object.keys(rows[0]).forEach(k => { keyMap[normalizeKey(k)] = k; });
  // Known aliases for column name typos
  const aliases = { 'regioin': 'region' };
  Object.keys(aliases).forEach(bad => {
    if (keyMap[bad] && !keyMap[aliases[bad]]) keyMap[aliases[bad]] = keyMap[bad];
  });
  const get = (row, col) => {
    const orig = keyMap[col];
    return orig !== undefined ? (row[orig] || '') : '';
  };

  // Validate required columns (using normalized names)
  const required = ['emp_id', 'name', 'designation', 'hq_code', 'hq_name', 'manager_emp_id', 'state', 'region'];
  const missing = required.filter(col => !keyMap[col]);
  if (missing.length > 0) {
    status.textContent = `Error: Missing columns: ${missing.join(", ")}`;
    return;
  }

  status.textContent = `Clearing old employee records (except ADMIN)…`;
  // Delete all non-admin employees first (keeps hierarchy updates clean)
  const { error: delError } = await sb.from('employees').delete().neq('emp_id', 'ADLA02');
  if (delError) {
    status.textContent = "Failed to clear existing employees: " + delError.message;
    return;
  }

  // Build full employee list (excluding ADLA02 to avoid duplicate PK)
  const allEmps = rows.map(r => ({
    emp_id:         get(r,'emp_id').toString().trim(),
    name:           get(r,'name').toString().trim(),
    designation:    get(r,'designation').toString().trim(),
    hq_code:        get(r,'hq_code').toString().trim(),
    hq_name:        get(r,'hq_name').toString().trim(),
    manager_emp_id: get(r,'manager_emp_id').toString().trim() || null,
    state:          get(r,'state').toString().trim(),
    region:         get(r,'region').toString().trim(),
    is_admin:       get(r,'designation').toString().trim().toUpperCase() === 'ADMIN'
  })).filter(x => x.emp_id && x.emp_id !== 'ADLA02');

  // PASS 1: Insert all employees with manager_emp_id = null to avoid FK violations
  status.textContent = `Pass 1/2: Inserting ${allEmps.length} employees (no manager links yet)…`;
  const batchSize = 100;
  for (let i = 0; i < allEmps.length; i += batchSize) {
    const batch = allEmps.slice(i, i + batchSize).map(r => ({ ...r, manager_emp_id: null }));
    const { error: insError } = await sb.from('employees').insert(batch);
    if (insError) {
      status.textContent = `Pass 1 failed at row ${i}: ` + insError.message;
      console.error('Pass 1 insert error:', insError);
      return;
    }
    progBar.style.width = Math.round(((i + batch.length) / allEmps.length) * 40) + '%';
  }

  // PASS 2: Update each employee's manager_emp_id
  status.textContent = `Pass 2/2: Setting manager relationships…`;
  const withManager = allEmps.filter(r => r.manager_emp_id);
  for (let i = 0; i < withManager.length; i += batchSize) {
    const batch = withManager.slice(i, i + batchSize);
    for (const emp of batch) {
      const { error: updErr } = await sb.from('employees')
        .update({ manager_emp_id: emp.manager_emp_id })
        .eq('emp_id', emp.emp_id);
      if (updErr) {
        status.textContent = `Pass 2 failed for ${emp.emp_id}: ` + updErr.message;
        console.error('Pass 2 update error:', updErr);
        return;
      }
    }
    progBar.style.width = (40 + Math.round(((i + batch.length) / withManager.length) * 35)) + '%';
  }

  const adla02Row = rows.find(r => get(r, 'emp_id').toString().trim() === 'ADLA02');
  if (adla02Row) {
    const { error: syncError } = await sb.from('employees')
      .update({
        name: get(adla02Row, 'name').toString().trim(),
        designation: get(adla02Row, 'designation').toString().trim(),
        hq_code: get(adla02Row, 'hq_code').toString().trim(),
        hq_name: 'Mumbai',
        manager_emp_id: get(adla02Row, 'manager_emp_id').toString().trim() || null,
        state: get(adla02Row, 'state').toString().trim(),
        region: get(adla02Row, 'region').toString().trim(),
        is_admin: false
      })
      .eq('emp_id', 'ADLA02');
    if (syncError) {
      status.textContent = "Failed to sync ADLA02 HQ: " + syncError.message;
      return;
    }
  }


  status.textContent = `Initializing default employee passwords (to Employee ID)…`;
  // Set password for all loaded employees
  for (let i = 0; i < rows.length; i++) {
    const empId = rows[i].emp_id;
    if (empId) {
      await sb.rpc('set_password', { p_emp_id: empId.toString().trim(), p_password: empId.toString().trim() });
    }
    progBar.style.width = (50 + Math.round((i / rows.length) * 50)) + "%";
  }

  status.innerHTML = `<span style="color:var(--good);font-weight:600;">Done.</span> Successfully imported ${rows.length} employee records and set default passwords.`;
}

// ---------------- TARGET UPLOAD ----------------
async function handleTargetUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("targetUpStatus");
  const progBar = document.getElementById("targetProgBar");
  const targetsUrl = `${SUPABASE_URL}/rest/v1/targets`;
  const targetsHeaders = {
    "apikey": SUPABASE_ANON_KEY,
    "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
    "Content-Type": "application/json",
    "Prefer": "return=representation"
  };

  status.textContent = "Reading file...";
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws);

  if (rows.length === 0) {
    status.textContent = "The file is empty.";
    return;
  }

  const normalizeKey = k => k.toString().toLowerCase().trim().replace(/\s+/g,'_');
  const keyMap = {};
  Object.keys(rows[0]).forEach(k => { keyMap[normalizeKey(k)] = k; });

  const get = (row, col) => {
    const orig = keyMap[col];
    return orig !== undefined ? (row[orig] ?? '') : '';
  };
  const cleanText = (value) => {
    if (value === null || value === undefined) return '';
    return value
      .toString()
      .normalize('NFKC')
      .replace(/\\/g, '')
      .replace(/[\u0000-\u001F\u007F]/g, ' ')
      .replace(/[\uD800-\uDFFF]/g, '')
      .replace(/[^\x20-\x7E]/g, '')
      .replace(/\s+/g, ' ')
      .trim();
  };
  const cleanNumber = (value) => {
    const num = parseFloat(value);
    return Number.isFinite(num) ? num : 0;
  };

  const required = [
    'emp_id', 'hq_code', 'hq_name', 'brand', 'product_code', 'state',
    'region', 'no_of_be', 'month_num', 'month_name', 'year',
    'val_target_total', 'unit_target_total', 'val_target_per_be', 'unit_target_per_be'
  ];
  const missing = required.filter(col => !keyMap[col]);
  if (missing.length > 0) {
    status.textContent = `Error: Missing columns: ${missing.join(", ")}`;
    return;
  }

  if (!confirm(`This will replace ALL existing targets with ${rows.length} new rows. Continue?`)) {
    status.textContent = "Upload cancelled.";
    return;
  }

  status.textContent = "Clearing old target records...";
  const delResp = await fetch(`${targetsUrl}?id=gte.0`, {
    method: "DELETE",
    headers: {
      "apikey": SUPABASE_ANON_KEY,
      "Authorization": `Bearer ${SUPABASE_ANON_KEY}`,
      "Content-Type": "application/json",
      "Prefer": "return=minimal"
    }
  });
  if (!delResp.ok) {
    status.textContent = "Failed to clear existing targets: " + (await delResp.text());
    return;
  }

  const batchSize = 250;
  let inserted = 0;
  const failedRows = [];
  status.textContent = `Uploading ${rows.length} target rows...`;
  const buildRow = (r) => ({
    emp_id: cleanText(get(r, 'emp_id')),
    hq_code: cleanText(get(r, 'hq_code')),
    hq_name: cleanText(get(r, 'hq_name')),
    brand: cleanText(get(r, 'brand')),
    product_code: cleanText(get(r, 'product_code')),
    state: cleanText(get(r, 'state')),
    region: cleanText(get(r, 'region')),
    no_of_be: cleanNumber(get(r, 'no_of_be')),
    month_num: parseInt(get(r, 'month_num')) || null,
    month_name: cleanText(get(r, 'month_name')),
    year: parseInt(get(r, 'year')) || null,
    val_target_total: cleanNumber(get(r, 'val_target_total')),
    unit_target_total: cleanNumber(get(r, 'unit_target_total')),
    val_target_per_be: cleanNumber(get(r, 'val_target_per_be')),
    unit_target_per_be: cleanNumber(get(r, 'unit_target_per_be'))
  });

  for (let i = 0; i < rows.length; i += batchSize) {
    const batch = rows.slice(i, i + batchSize).map(buildRow).filter(r => r.emp_id && r.hq_code && r.month_num && r.year);

    if (batch.length > 0) {
      const batchResp = await fetch(targetsUrl, {
        method: "POST",
        headers: targetsHeaders,
        body: JSON.stringify(batch)
      });
      if (!batchResp.ok) {
        const batchErrorText = await batchResp.text();
        console.warn('Batch insert failed, retrying row-by-row:', { startRow: i + 1, error: batchErrorText });
        let recovered = 0;
        for (let j = 0; j < batch.length; j++) {
          const row = batch[j];
          const rowResp = await fetch(targetsUrl, {
            method: "POST",
            headers: targetsHeaders,
            body: JSON.stringify([row])
          });
          if (!rowResp.ok) {
            const rowErrorText = await rowResp.text();
            failedRows.push({ rowNumber: i + j + 1, emp_id: row.emp_id, hq_code: row.hq_code, error: rowErrorText });
            console.warn('Target upload row skipped:', { rowNumber: i + j + 1, row, error: rowErrorText });
            continue;
          }
          recovered++;
        }
        inserted += recovered;
      } else {
        inserted += batch.length;
      }
    }

    progBar.style.width = Math.round((Math.min(i + batchSize, rows.length) / rows.length) * 100) + "%";
    status.textContent = `Uploaded ${Math.min(i + batchSize, rows.length)} of ${rows.length} target rows...`;
  }

  if (failedRows.length > 0) {
    const preview = failedRows.slice(0, 5).map(r => `${r.rowNumber} (${r.emp_id} / ${r.hq_code})`).join(", ");
    status.innerHTML = `<span style="color:var(--good);font-weight:600;">Done.</span> Imported ${inserted} target rows. Skipped ${failedRows.length} row(s): ${preview}${failedRows.length > 5 ? ", ..." : ""}`;
  } else {
    status.innerHTML = `<span style="color:var(--good);font-weight:600;">Done.</span> Successfully imported ${inserted} target rows.`;
  }
}

// ---------------- STOCKIST MAPPING UPLOAD ----------------
async function handleStockistMappingUpload(e){
  const file = e.target.files[0];
  if (!file) return;
  const status = document.getElementById("smUpStatus");
  const progBar = document.getElementById("smProgBar");

  status.textContent = "Reading file…";
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(ws);

  if (rows.length === 0) {
    status.textContent = "The file is empty.";
    return;
  }

  // Validate columns
  const firstRow = rows[0];
  const required = ['distributor_code', 'distributor_name', 'distributor_city', 'stockist_code', 'stockist_name', 'hq_code', 'hq_name'];
  const missing = required.filter(col => !(col in firstRow));
  if (missing.length > 0) {
    status.textContent = `Error: Missing columns: ${missing.join(", ")}`;
    return;
  }

  if (!confirm(`This will replace ALL stockist mapping records with ${rows.length} new rows. Continue?`)) {
    status.textContent = "Upload cancelled.";
    return;
  }

  // Step 1: Delete all existing records in batches to avoid RLS timeout issues
  status.textContent = "Clearing existing stockist mapping records…";
  let deleteFrom = 0;
  let totalDeleted = 0;
  while (true) {
    // Fetch a batch of stockist_codes to delete
    const { data: toDelete, error: fetchErr } = await sb
      .from('stockist_mapping')
      .select('stockist_code')
      .range(0, 199);
    if (fetchErr) {
      status.textContent = "Failed to fetch records for deletion: " + fetchErr.message;
      console.error('Delete fetch error:', fetchErr);
      return;
    }
    if (!toDelete || toDelete.length === 0) break;
    const codes = toDelete.map(r => r.stockist_code);
    const { error: delError } = await sb.from('stockist_mapping').delete().in('stockist_code', codes);
    if (delError) {
      status.textContent = "Failed to clear stockist mapping: " + delError.message;
      console.error('Delete error:', delError);
      return;
    }
    totalDeleted += codes.length;
    status.textContent = `Cleared ${totalDeleted} old records…`;
  }
  console.log(`Deleted ${totalDeleted} old stockist_mapping records`);

  // Step 2: Insert new records in batches
  status.textContent = `Uploading ${rows.length} stockist mapping records…`;
  const batchSize = 100;
  let totalInserted = 0;
  for (let i = 0; i < rows.length; i += batchSize) {
    const batch = rows.slice(i, i + batchSize).map(r => ({
      distributor_code: (r.distributor_code || '').toString().trim(),
      distributor_name: (r.distributor_name || '').toString().trim(),
      distributor_city: (r.distributor_city || '').toString().trim(),
      stockist_code: (r.stockist_code || '').toString().trim(),
      stockist_name: (r.stockist_name || '').toString().trim(),
      hq_code: (r.hq_code || '').toString().trim(),
      hq_name: (r.hq_name || '').toString().trim(),
      area: (r.area || '').toString().trim(),
      region: (r.region || '').toString().trim(),
      zone: (r.zone || '').toString().trim(),
      be_emp_id_1: (r.be_emp_id_1 || '').toString().trim() || null,
      be_emp_id_2: (r.be_emp_id_2 || '').toString().trim() || null,
      be_emp_id_3: (r.be_emp_id_3 || '').toString().trim() || null,
      asm_emp_id: (r.asm_emp_id || '').toString().trim() || null,
      rsm_emp_id: (r.rsm_emp_id || '').toString().trim() || null,
      zm_emp_id: (r.zm_emp_id || '').toString().trim() || null,
      vp_emp_id: (r.vp_emp_id || '').toString().trim() || null
    })).filter(r => r.stockist_code);

    if (batch.length > 0) {
      const { error: insError } = await sb.from('stockist_mapping').insert(batch);
      if (insError) {
        status.textContent = `Failed to insert batch at row ${i}: ` + insError.message;
        console.error('Insert error at row', i, insError);
        return;
      }
      totalInserted += batch.length;
    }

    progBar.style.width = Math.round(((i + batchSize) / rows.length) * 100) + "%";
    status.textContent = `Uploaded ${Math.min(i + batchSize, rows.length)} of ${rows.length} records…`;
  }

  console.log(`Inserted ${totalInserted} stockist_mapping records`);
  status.innerHTML = `<span style="color:var(--good);font-weight:600;">Done.</span> Successfully imported ${totalInserted} of ${rows.length} stockist mapping records.`;
}

async function loadMultiCompareData(activeScopeIds, pill) {
  const body = document.getElementById("dashBody");
  
  if (mcSelectedViews.length === 0 || mcSelectedMonths.length === 0) {
    body.innerHTML = `<p class="muted" style="text-align:center; padding:40px;">No views or months selected. Click "Configure Options" to set up your comparison.</p>`;
    return;
  }
  
  body.innerHTML = `<p class="muted" style="text-align:center; padding:40px;">Generating Multi-Compare Report... This may take a moment.</p>`;

  const requiredMonths = new Set();
  mcSelectedMonths.forEach(m => {
    if (mcSelectedViews.includes('monthly')) requiredMonths.add(m);
    if (mcSelectedViews.includes('bimonthly')) {
      const startMonth = m % 2 === 1 ? m : m - 1;
      requiredMonths.add(startMonth);
      requiredMonths.add(startMonth + 1);
    }
    if (mcSelectedViews.includes('mtd')) requiredMonths.add(m);
    if (mcSelectedViews.includes('ytd')) {
      for(let i=1; i<=m; i++) requiredMonths.add(i);
    }
  });
  const monthsVal = Array.from(requiredMonths);

  async function fetchAllRows(tableName, filterCol, yearCol, monthCol, yVal, mVal, applyScopeFilter = false) {
    let allRows = [];
    let from = 0;
    const orderCol = tableName === 'targets' || tableName === 'sales' ? 'id' : 'sale_id';
    while (true) {
      let query = sb.from(tableName).select('*').eq(yearCol, yVal).in(monthCol, mVal);
      if (applyScopeFilter) {
        query = query.in(filterCol, activeScopeIds);
      }
      const { data, error } = await query.order(orderCol, { ascending: true }).range(from, from + 999);
      if (error) break;
      allRows = allRows.concat(data);
      if (data.length < 1000) break;
      from += 1000;
    }
    return allRows;
  }

  const isCompanyOverall = selectedEmpId === 'overall' && (session.designation === 'ADMIN' || session.designation === 'VP');

  const [tgt, achAttr, lastYearAttr] = await Promise.all([
    fetchAllRows('targets', 'emp_id', 'year', 'month_num', currentYear, monthsVal, true),
    fetchAllRows('sales_attributed', 'be_emp_id', 'period_year', 'period_month', currentYear, monthsVal, true),
    fetchAllRows('sales_attributed', 'be_emp_id', 'period_year', 'period_month', currentYear - 1, monthsVal, true)
  ]);

  const filteredAch = achAttr.filter(r => !(r.brand || '').endsWith('(FREE)') && r.brand !== 'HYGIENE_EXPIRY');
  const filteredLastYear = lastYearAttr.filter(r => !(r.brand || '').endsWith('(FREE)') && r.brand !== 'HYGIENE_EXPIRY');

  const teamMap = {};
  // Normalise HQ name (shared with loadDashboardData logic)
  const normalizeHqName = (hq) => {
    if (!hq) return 'Unknown';
    return hq.replace(/\s*\(Vacant\s*BE\)\s*/gi, '').trim() || 'Unknown';
  };

  let stockistHqMap = new Map();
  try {
     let from = 0;
     while(true) {
        const {data, error} = await sb.from('stockist_mapping').select('stockist_code, hq_name').range(from, from + 999);
        if (error || !data) break;
        data.forEach(m => { if(m.hq_name) stockistHqMap.set(normalizeEmpId(m.stockist_code), normalizeHqName(m.hq_name)); });
        if(data.length < 1000) break;
        from += 1000;
     }
  } catch(e) { console.error('Failed to load stockist mappings', e); }

  allDownlineEmployees.forEach(e => {
    if (activeScopeIds.includes(e.emp_id) && e.designation === 'BE') {
      const hNames = getHierarchyNames(e.emp_id, e.state);
      teamMap[e.emp_id] = { emp: { ...e, asm_name: hNames.asm, rsm_name: hNames.rsm, zsm_name: hNames.zsm, state: hNames.state }, data: {} };
    }
  });

  const getGroup = (emp_id, view, month, r) => {
    let empId = emp_id;
    if (!teamMap[empId]) {
      // emp not a known BE → route to Vacant HQ
      // r may be a sales record (has hq_name) or a target record (hq_name may be absent)
      const rawHq = r ? r.hq_name : null;
      let hq = normalizeHqName(rawHq);
      if (hq.toUpperCase() === 'UDIPI') hq = 'MANGALORE';
      if (hq === 'Unknown' && !rawHq) {
        const sHq = (r && r.stockist_code) ? stockistHqMap.get(normalizeEmpId(r.stockist_code)) : null;
        if (sHq) {
          hq = sHq;
          if (hq.toUpperCase() === 'UDIPI') hq = 'MANGALORE';
        } else {
          // target record has no hq_name – look up from allDownlineEmployees
          const empRec = allDownlineEmployees.find(e => e.emp_id === emp_id);
          if (empRec && empRec.hq_name) {
            hq = normalizeHqName(empRec.hq_name);
            if (hq.toUpperCase() === 'UDIPI') hq = 'MANGALORE';
          }
        }
      }
      empId = 'VACANT_' + hq;
      if (!teamMap[empId]) {
        let region = '';
        const peer = allDownlineEmployees.find(e => e.hq_name === hq);
        if (peer) { region = peer.region || ''; }
        const fallbackState = peer ? (peer.state || '-') : '-';
        const hNames = getHierarchyNames(emp_id, fallbackState);
        teamMap[empId] = {
          emp: { emp_id: empId, name: hq + '_Vacant', designation: 'BE', hq_name: hq, hq_code: (r && r.hq_code) ? r.hq_code : '', state: hNames.state, region: region, asm_name: hNames.asm, rsm_name: hNames.rsm, zsm_name: hNames.zsm },
          data: {}
        };
      }
    }
    if (!teamMap[empId]) return null;
    const key = view + '_' + month;
    if (!teamMap[empId].data[key]) teamMap[empId].data[key] = { target: 0, ach: 0, lastYear: 0 };
    return teamMap[empId].data[key];
  };

  const todayDateObj = new Date();
  const referenceDate = (todayDateObj.getFullYear() < 2025 || todayDateObj.getFullYear() > 2030) ? defaultDate : todayDateObj;
  const todayStr = referenceDate.toISOString().slice(0, 10);
  const lastYearTodayStr = new Date(referenceDate.getFullYear() - 1, referenceDate.getMonth(), referenceDate.getDate()).toISOString().slice(0, 10);
  const mtdCurrentMonth = getFiscalMonthNum(referenceDate);
  const elapsedDays = referenceDate.getDate();
  const daysInMonth = new Date(referenceDate.getFullYear(), referenceDate.getMonth() + 1, 0).getDate();
  const mtdRatio = elapsedDays / daysInMonth;

  tgt.forEach(r => {
    const val = (parseFloat(r.val_target_per_be)||0) * 100000;
    const m = r.month_num;
    const empId = r.emp_id;

    mcSelectedMonths.forEach(sm => {
      if (mcSelectedViews.includes('monthly') && m === sm) {
        const g = getGroup(empId, 'monthly', sm, r);
        if (g) g.target += val;
      }
      if (mcSelectedViews.includes('bimonthly')) {
        const startMonth = sm % 2 === 1 ? sm : sm - 1;
        if (m === startMonth || m === startMonth + 1) {
          const g = getGroup(empId, 'bimonthly', sm, r);
          if (g) g.target += val;
        }
      }
      if (mcSelectedViews.includes('ytd') && m <= sm) {
        const g = getGroup(empId, 'ytd', sm, r);
        if (g) g.target += val;
      }
      if (mcSelectedViews.includes('mtd') && m === sm) {
        const g = getGroup(empId, 'mtd', sm, r);
        if (g) g.target += (sm === mtdCurrentMonth) ? (val * mtdRatio) : val;
      }
    });
  });

  filteredAch.forEach(r => {
    const val = parseFloat(r.amount)||0;
    const m = r.period_month;
    const empId = r.be_emp_id;
    
    mcSelectedMonths.forEach(sm => {
      const startMonth = sm % 2 === 1 ? sm : sm - 1;
      if (mcSelectedViews.includes('monthly') && m === sm) {
        const g = getGroup(empId, 'monthly', sm, r);
        if (g) g.ach += val;
      }
      if (mcSelectedViews.includes('bimonthly') && (m === startMonth || m === startMonth + 1)) {
        const g = getGroup(empId, 'bimonthly', sm, r);
        if (g) g.ach += val;
      }
      if (mcSelectedViews.includes('ytd') && m <= sm) {
        const g = getGroup(empId, 'ytd', sm, r);
        if (g) g.ach += val;
      }
      if (mcSelectedViews.includes('mtd') && m === sm && (!r.bill_date || r.bill_date <= todayStr)) {
        const g = getGroup(empId, 'mtd', sm, r);
        if (g) g.ach += val;
      }
    });
  });

  filteredLastYear.forEach(r => {
    const val = parseFloat(r.amount)||0;
    const m = r.period_month;
    const empId = r.be_emp_id;
    
    mcSelectedMonths.forEach(sm => {
      const startMonth = sm % 2 === 1 ? sm : sm - 1;
      if (mcSelectedViews.includes('monthly') && m === sm) {
        const g = getGroup(empId, 'monthly', sm, r);
        if (g) g.lastYear += val;
      }
      if (mcSelectedViews.includes('bimonthly') && (m === startMonth || m === startMonth + 1)) {
        const g = getGroup(empId, 'bimonthly', sm, r);
        if (g) g.lastYear += val;
      }
      if (mcSelectedViews.includes('ytd') && m <= sm) {
        const g = getGroup(empId, 'ytd', sm, r);
        if (g) g.lastYear += val;
      }
      if (mcSelectedViews.includes('mtd') && m === sm && (!r.bill_date || r.bill_date <= lastYearTodayStr)) {
        const g = getGroup(empId, 'mtd', sm, r);
        if (g) g.lastYear += val;
      }
    });
  });

  const formatLakhs = (val) => {
    if (!val || val === 0) return '-';
    return (val / 100000).toFixed(2) + ' L';
  };

  const getMonthLabel = (m) => FY_MONTHS.find(x => x.n === m)?.label || m;

  let colsHtml = '';
  let subColsHtml = '';
  
  const maxSelectedMonth = Math.max(...mcSelectedMonths);
  const selectedCombos = [];
  mcSelectedMonths.forEach(sm => {
    const monthName = getMonthLabel(sm);
    mcSelectedViews.forEach(v => {
      if (v === 'ytd' && sm !== maxSelectedMonth) return;

      selectedCombos.push({ month: sm, view: v });
      let viewLabel = v.toUpperCase();
      if (v === 'monthly') viewLabel = 'Monthly';
      if (v === 'bimonthly') viewLabel = 'Bi-Monthly';
      
      colsHtml += `<th colspan="4" style="text-align:center; border-left:2px solid #cbd5e1; background:#f1f5f9;">${monthName} - ${viewLabel}</th>`;

    });
  });

  const teamRows = Object.values(teamMap).filter(t => 
    Object.values(t.data).some(g => g.target > 0 || g.ach > 0 || g.lastYear > 0)
  );
  teamRows.sort((a,b) => (a.emp.hq_name||'').localeCompare(b.emp.hq_name||''));

  let rowsHtml = '';
  lastDashboardData.multiCompareRows = [];

  teamRows.forEach(row => {
    const exportRow = {
      'HQ Name': row.emp.hq_name,
      'State': row.emp.state || '-',
      'ASM': row.emp.asm_name || '-',
      'RSM': row.emp.rsm_name || '-',
      'ZSM': row.emp.zsm_name || '-',
      'Employee Name': row.emp.name || row.emp.emp_id
    };

    rowsHtml += `<tr>
      <td style="position:sticky; left:0; background:#fff; z-index:10; border-right:1px solid #e2e8f0;"><b>${row.emp.hq_name}</b></td>
      <td style="position:sticky; left:120px; background:#fff; z-index:10; border-right:1px solid #e2e8f0;">${row.emp.state || '-'}</td>
      <td style="position:sticky; left:220px; background:#fff; z-index:10; border-right:2px solid #cbd5e1;">${row.emp.name || row.emp.emp_id}</td>`;
    
    selectedCombos.forEach(combo => {
      const g = row.data[combo.view + '_' + combo.month] || { target:0, ach:0, lastYear:0 };
      const growth = g.lastYear > 0 ? ((g.ach - g.lastYear)/g.lastYear * 100) : null;
      let growthColor = '';
      if (growth !== null) {
        growthColor = growth >= 0 ? 'color:var(--good);' : 'color:var(--bad);';
      }
      
      const pctAch = g.target > 0 ? Math.round((g.ach / g.target) * 100) + '%' : '-';
      
      let viewLabel = combo.view.toUpperCase();
      if (combo.view === 'monthly') viewLabel = 'Monthly';
      if (combo.view === 'bimonthly') viewLabel = 'Bi-Monthly';
      const colPrefix = getMonthLabel(combo.month) + ' - ' + viewLabel;
      
      exportRow[`${colPrefix} Target`] = g.target ? Number((g.target / 100000).toFixed(2)) : 0;
      exportRow[`${colPrefix} Ach`] = g.ach ? Number((g.ach / 100000).toFixed(2)) : 0;
      exportRow[`${colPrefix} % Ach`] = pctAch;
      exportRow[`${colPrefix} Growth`] = growth !== null ? growth.toFixed(1) + '%' : '-';

      rowsHtml += `
        <td style="text-align:right; border-left:2px solid #cbd5e1;">${formatLakhs(g.target)}</td>
        <td style="text-align:right;">${formatLakhs(g.ach)}</td>
        <td style="text-align:right; font-weight:600;">${pctAch}</td>
        <td style="text-align:right; font-weight:600; ${growthColor}">${growth !== null ? growth.toFixed(1)+'%' : '—'}</td>
      `;
    });
    rowsHtml += `</tr>`;
    lastDashboardData.multiCompareRows.push(exportRow);
  });

  if (teamRows.length === 0) {
    rowsHtml = `<tr><td colspan="${3 + selectedCombos.length * 4}" style="text-align:center; padding:20px;">No field force data available in scope.</td></tr>`;
  }

  body.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
      <h2 style="margin:0;">Multi-Period Compare (HQ Wise Summary)</h2>
    </div>
    <div class="stock-shell" style="overflow-x:auto; max-width:100%; padding:0;">

            <th rowspan="2" style="position:sticky; left:120px; background:#f8fafc; z-index:20; min-width:100px; border-right:1px solid #e2e8f0; vertical-align:middle;">State</th>
            <th rowspan="2" style="position:sticky; left:220px; background:#f8fafc; z-index:20; min-width:150px; border-right:2px solid #cbd5e1; vertical-align:middle;">Employee Name</th>
            ${colsHtml}
          </tr>
          <tr style="background:#f8fafc;">
            ${subColsHtml}
          </tr>
        </thead>
        <tbody>
          ${rowsHtml}
        </tbody>
      </table>
    </div>
  `;
}
